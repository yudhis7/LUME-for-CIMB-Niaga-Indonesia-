<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lume for CIMB Niaga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Lume console for CIMB Niaga: light operations console, Lume blue for action, CIMB red only for the workspace mark.
     Layout: top bar + grouped left nav + scrolling work area; advocate phone opens as a right drawer. */
  color-scheme: light;
  --bg: #f3f5f9;
  --surface: #ffffff;
  --surface-2: #f8f9fc;
  --ink: #131a27;
  --ink-2: #4a5467;
  --muted: #8790a3;
  --line: #e4e8ef;
  --line-2: #d3d9e3;
  --primary: #1668e3;
  --primary-ink: #0f4fb3;
  --primary-weak: #eaf1fe;
  --cimb: #c8102e;
  --alivia: #6250d6;
  --alivia-weak: #efedfc;
  --coral: #eb6834;
  --good: #0ca30c;
  --good-ink: #0b6e2c;
  --good-weak: #e6f6ea;
  --warn: #fab219;
  --warn-ink: #8a5a00;
  --warn-weak: #fff5dc;
  --serious: #ec835a;
  --crit: #d03b3b;
  --crit-ink: #a92525;
  --crit-weak: #fdeceb;
  --s1: #2a78d6;
  --neutral-seg: #a9a8a0;
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 8px;
  --shadow: 0 1px 2px rgba(19, 26, 39, .06), 0 4px 16px rgba(19, 26, 39, .06);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 13px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 4px; }
.num, table td.n, .tab-n { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- shell ---------- */
.app { display: grid; grid-template-rows: 52px 1fr; grid-template-columns: minmax(0, 1fr); height: 100%; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 0 16px; min-width: 0; overflow: visible; background: var(--surface); border-bottom: 1px solid var(--line); position: relative; z-index: 30; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; letter-spacing: -.01em; white-space: nowrap; }
.brand .whale { color: var(--primary); }
.brand .lume { background: linear-gradient(90deg, #1668e3, #6250d6 55%, #eb6834); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 800; }
.brand small { color: var(--muted); font-weight: 500; font-size: 11px; }
.ws { display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 4px; border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; }
.ws .mark { width: 22px; height: 22px; border-radius: 6px; background: var(--cimb); color: #fff; font-size: 10px; font-weight: 800; display: grid; place-items: center; }
.env { font-style: italic; font-weight: 700; color: var(--primary); font-size: 12px; }
.topbar .grow { flex: 1; }
.search { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; width: 240px; color: var(--muted); background: var(--surface-2); }
.search input { border: 0; outline: 0; background: transparent; width: 100%; color: var(--ink); }
.ai-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-2); padding: 3px 8px; border-radius: 999px; background: var(--alivia-weak); white-space: nowrap; }
.ai-badge i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
.ai-badge.live i { background: var(--good); box-shadow: 0 0 0 3px rgba(12,163,12,.15); }
.iconbtn { position: relative; border: 0; background: transparent; width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center; cursor: pointer; color: var(--ink-2); }
.iconbtn:hover { background: var(--surface-2); }
.dot-count { position: absolute; top: 2px; right: 1px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--crit); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }
.role-sel { border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; background: var(--surface); max-width: 220px; }

.body { display: grid; grid-template-columns: 212px 1fr; min-height: 0; }
.nav { background: var(--surface); border-right: 1px solid var(--line); overflow-y: auto; padding: 10px 8px 16px; }
.nav h6 { margin: 14px 10px 4px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; color: var(--ink-2); font-weight: 500; text-decoration: none; }
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.nav a.on { background: var(--primary-weak); color: var(--primary-ink); font-weight: 650; }
.nav a .badge { margin-left: auto; }
.nav .foot { margin: 18px 10px 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); }
.main { overflow-y: auto; min-width: 0; }
.page { padding: 18px 22px 40px; max-width: 1480px; }
.crumb { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.crumb b { color: var(--ink); font-weight: 650; font-size: 15px; }
.pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
.pagehead p { margin: 4px 0 0; color: var(--ink-2); max-width: 80ch; }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ---------- primitives ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; white-space: nowrap; color: var(--ink); }
.btn:hover { border-color: var(--primary); color: var(--primary); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { background: var(--primary-ink); color: #fff; }
.btn.ai { background: var(--alivia); border-color: var(--alivia); color: #fff; }
.btn.ai:hover { filter: brightness(.95); color: #fff; }
.btn.danger { color: var(--crit-ink); border-color: #f1c3c0; }
.btn.danger:hover { background: var(--crit-weak); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.btn[disabled], .btn.locked { opacity: .5; cursor: not-allowed; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.card > .hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px 0; }
.card > .hd h3 { font-size: 13.5px; font-weight: 700; }
.card > .hd .sub { color: var(--muted); font-size: 12px; font-weight: 500; }
.card > .bd { padding: 12px 14px 14px; }
.grid { display: grid; gap: 14px; }
.grid > * { min-width: 0; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.span2 { grid-column: span 2; }
.row { display: flex; gap: 8px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.stack { display: grid; gap: 8px; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.small { font-size: 12px; }
.tiny { font-size: 11px; }
.b { font-weight: 700; }
.mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; }
.hr { height: 1px; background: var(--line); margin: 12px 0; }

.kpi { padding: 12px 14px; }
.kpi .v { font-size: 24px; font-weight: 750; letter-spacing: -.02em; line-height: 1.1; }
.kpi .l { color: var(--ink-2); font-size: 12px; margin-top: 2px; }
.kpi .d { font-size: 11px; margin-top: 4px; color: var(--muted); }
.kpi.alert { border-left: 3px solid var(--crit); }
.kpi.warn { border-left: 3px solid var(--warn); }
.kpi.ok { border-left: 3px solid var(--good); }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.pill.blue { background: var(--primary-weak); color: var(--primary-ink); border-color: #cfe0fc; }
.pill.violet { background: var(--alivia-weak); color: #4a3ab4; border-color: #dcd7f7; }
.pill.good { background: var(--good-weak); color: var(--good-ink); border-color: #c4e8cd; }
.pill.warn { background: var(--warn-weak); color: var(--warn-ink); border-color: #f5dfa5; }
.pill.crit { background: var(--crit-weak); color: var(--crit-ink); border-color: #f4c7c4; }
.pill.coral { background: #fdeee7; color: #a8441a; border-color: #f7d2c2; }
.pill.dark { background: #1d2433; color: #fff; border-color: #1d2433; }
.badge { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; font-size: 10.5px; font-weight: 700; background: var(--crit); color: #fff; }
.badge.blue { background: var(--primary); }
.badge.grey { background: var(--line-2); color: var(--ink-2); }
.sdot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 1px; }
.sdot.good { background: var(--good); } .sdot.warn { background: var(--warn); } .sdot.crit { background: var(--crit); } .sdot.blue { background: var(--primary); } .sdot.serious { background: var(--serious); }

.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.tbl th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11.5px; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface-2); }
.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: #f6f9ff; }
.tbl td.n, .tbl th.n { text-align: right; font-variant-numeric: tabular-nums; }
.tbl tr.sel td { background: var(--primary-weak); }

.input, select.input, textarea.input { width: 100%; border: 1px solid var(--line-2); border-radius: 6px; padding: 7px 10px; background: var(--surface); outline: none; }
.input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(22,104,227,.12); }
textarea.input { resize: vertical; min-height: 84px; line-height: 1.5; }
label.fl { display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.chk { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--line-2); border-radius: 6px; cursor: pointer; font-size: 12px; background: var(--surface); user-select: none; }
.chk input { margin: 0; }
.chk.on { border-color: var(--primary); background: var(--primary-weak); color: var(--primary-ink); }
.chk.lock { opacity: .55; cursor: not-allowed; }
.switch { position: relative; width: 34px; height: 20px; border-radius: 10px; background: var(--line-2); border: 0; cursor: pointer; flex: none; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch.on { background: var(--primary); }
.switch.on::after { left: 16px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
.tabs button { border: 0; background: transparent; padding: 8px 12px; cursor: pointer; font-weight: 600; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button.on { color: var(--primary); border-bottom-color: var(--primary); }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line-2); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button.on { background: var(--primary); color: #fff; }
.progress { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--primary); border-radius: 3px; }
.progress.good > i { background: var(--good); } .progress.warn > i { background: var(--warn); } .progress.crit > i { background: var(--crit); }
.ring { --p: 0; width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(var(--primary) calc(var(--p) * 1%), var(--line) 0); display: inline-block; vertical-align: -4px; margin-right: 6px; -webkit-mask: radial-gradient(circle 5px, transparent 98%, #000); mask: radial-gradient(circle 5px, transparent 98%, #000); }

.plat { display: inline-grid; place-items: center; border-radius: 6px; color: #fff; flex: none; }
.plat svg { display: block; }
.empty { padding: 28px; text-align: center; color: var(--muted); }
.note { font-size: 11.5px; color: var(--muted); margin-top: 10px; }
.callout { border-radius: var(--radius); padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start; border: 1px solid; }
.callout.crit { background: var(--crit-weak); border-color: #f4c7c4; color: #6e1a1a; }
.callout.warn { background: var(--warn-weak); border-color: #f5dfa5; color: #5c3d00; }
.callout.info { background: var(--primary-weak); border-color: #cfe0fc; color: #123e85; }
.callout.violet { background: var(--alivia-weak); border-color: #dcd7f7; color: #2e2479; }
.callout .grow { flex: 1; }
.dark-panel { background: #172033; color: #e7ebf3; border-radius: var(--radius); padding: 14px; }
.dark-panel h4 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #9fb0cc; margin-bottom: 8px; }
mark.flag { background: #fde1df; color: var(--crit-ink); border-radius: 3px; padding: 0 2px; box-shadow: inset 0 -2px 0 var(--crit); }
mark.pii { background: #fff1c7; color: #6b4a00; border-radius: 3px; padding: 0 2px; }

/* ---------- avatars ---------- */
.av { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10.5px; font-weight: 700; color: #fff; flex: none; }
.who { display: inline-flex; align-items: center; gap: 8px; }

/* ---------- charts ---------- */
.hbars { display: grid; gap: 8px; }
.hbar { display: grid; grid-template-columns: var(--lw, 120px) minmax(40px, 1fr) auto; gap: 10px; align-items: center; font-size: 12px; }
.hbar .lab { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbar .trk { height: 14px; background: transparent; position: relative; }
.hbar .trk i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; background: var(--s1); min-width: 2px; }
.hbar .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; }
.chart-tip { position: fixed; pointer-events: none; z-index: 200; background: #172033; color: #fff; font-size: 12px; padding: 6px 9px; border-radius: 6px; box-shadow: var(--shadow); max-width: 280px; display: none; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
svg text { font-family: var(--font); }

/* ---------- modal / drawer / toast ---------- */
.overlay { position: fixed; inset: 0; background: rgba(19, 26, 39, .38); z-index: 100; display: grid; place-items: center; padding: 20px; }
.modal { background: var(--surface); border-radius: 10px; width: min(760px, 100%); max-height: calc(100vh - 40px); min-height: 0; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.modal.wide { width: min(1040px, 100%); }
.modal .mh { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.modal .mh h3 { font-size: 15px; }
.modal .mb { padding: 16px 18px; overflow-y: auto; min-height: 0; flex: 1 1 auto; }
.modal .mf { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); background: var(--surface-2); border-radius: 0 0 10px 10px; flex-wrap: wrap; align-items: center; }
.toasts { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 300; display: grid; gap: 8px; justify-items: center; }
.toast { background: #172033; color: #fff; padding: 9px 14px; border-radius: 8px; box-shadow: var(--shadow); font-size: 12.5px; display: flex; gap: 8px; align-items: center; animation: tin .2s ease-out; max-width: 560px; }
@keyframes tin { from { transform: translateY(8px); opacity: 0; } }
.popover { position: absolute; top: 46px; right: 12px; width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 40px rgba(0,0,0,.16); z-index: 60; max-height: 70vh; overflow-y: auto; }
.popover .it { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; cursor: pointer; }
.popover .it:hover { background: var(--surface-2); }

.drawer { position: fixed; top: 52px; right: 0; bottom: 0; width: 430px; background: #e9edf4; border-left: 1px solid var(--line-2); z-index: 50; display: flex; flex-direction: column; box-shadow: -10px 0 30px rgba(0,0,0,.08); }
.drawer .dh { padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
.drawer .db { flex: 1; overflow-y: auto; display: grid; place-items: start center; padding: 16px 0 24px; }
body.has-drawer .main { margin-right: 430px; }

/* ---------- phone (advocate app, Bahasa) ---------- */
.phone { width: 360px; height: 720px; border-radius: 42px; background: #0f1420; padding: 11px; box-shadow: 0 20px 50px rgba(15,20,32,.35); flex: none; }
.screen { width: 100%; height: 100%; border-radius: 32px; background: #f5f7fb; overflow: hidden; display: flex; flex-direction: column; position: relative; }
.sbar { height: 34px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 12px; font-weight: 700; color: var(--ink); flex: none; background: #fff; }
.ph-top { background: #fff; padding: 6px 16px 10px; border-bottom: 1px solid var(--line); flex: none; }
.ph-top .t { font-weight: 750; font-size: 15px; }
.ph-body { flex: 1; overflow-y: auto; padding: 12px; display: grid; gap: 10px; align-content: start; }
.ph-tabs { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); background: #fff; border-top: 1px solid var(--line); padding: 6px 4px 14px; }
.ph-tabs button { border: 0; background: transparent; display: grid; justify-items: center; gap: 2px; font-size: 10.5px; color: var(--muted); cursor: pointer; font-weight: 600; }
.ph-tabs button.on { color: var(--primary); }
.ph-card { background: #fff; border-radius: 14px; padding: 12px; border: 1px solid var(--line); }
.ph-card.task { cursor: pointer; }
.ph-card.task:hover { border-color: var(--primary); }
.ph-btn { width: 100%; border: 0; border-radius: 12px; padding: 11px; font-weight: 700; cursor: pointer; background: var(--primary); color: #fff; font-size: 13.5px; }
.ph-btn.sec { background: var(--primary-weak); color: var(--primary-ink); }
.ph-btn.ai { background: var(--alivia); }
.ph-btn[disabled] { background: #b8c2d4; cursor: not-allowed; }
.ph-assets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.ph-assets .a { border-radius: 10px; overflow: hidden; border: 2px solid transparent; cursor: pointer; aspect-ratio: 1; position: relative; }
.ph-assets .a.on { border-color: var(--primary); }
.ph-assets .a .ck { position: absolute; top: 4px; right: 4px; width: 18px; height: 18px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; }
.okchip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: var(--good-weak); color: var(--good-ink); font-weight: 700; font-size: 12px; }
.badchip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: var(--crit-weak); color: var(--crit-ink); font-weight: 700; font-size: 12px; }
.ph-success { text-align: center; padding: 20px 8px; display: grid; gap: 10px; justify-items: center; }
.ph-success .big { width: 64px; height: 64px; border-radius: 50%; background: var(--good-weak); color: var(--good); display: grid; place-items: center; }
.spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--primary); animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- calendar ---------- */
.cal { display: grid; grid-template-columns: 170px repeat(7, minmax(110px, 1fr)); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); min-width: 980px; }
.cal > div { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-height: 64px; padding: 6px; }
.cal .ch { background: var(--surface-2); font-weight: 650; font-size: 12px; min-height: 0; padding: 8px; }
.cal .ch.today { color: var(--primary); }
.cal .rh { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 12px; background: var(--surface-2); }
.cal .cell { display: grid; gap: 4px; align-content: start; transition: background .1s; }
.cal .cell.over { background: var(--primary-weak); }
.post { border-radius: 6px; padding: 5px 7px; font-size: 11.5px; line-height: 1.3; cursor: grab; border: 1px solid var(--line-2); background: #fff; border-left: 3px solid var(--primary); }
.post .t { font-weight: 650; }
.post .m { color: var(--muted); font-size: 10.5px; }
.post.clash { outline: 2px solid var(--crit); outline-offset: -1px; background: #fff7f6; }
.post.camp-octo { border-left-color: var(--primary); }
.post.camp-waspada { border-left-color: var(--crit); }
.post.camp-km { border-left-color: var(--alivia); }
.post.camp-life { border-left-color: var(--good); }
.post.camp-syariah { border-left-color: #0f8a6a; }
.post.camp-tip { border-left-color: var(--warn); }
.post.locked { cursor: not-allowed; opacity: .75; }
.post.published { background: var(--surface-2); }

/* ---------- care desk ---------- */
.care { display: grid; grid-template-columns: 380px minmax(0, 1fr) 300px; gap: 14px; align-items: start; }
.queue { max-height: calc(100vh - 230px); overflow-y: auto; }
.qi { padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; display: grid; gap: 4px; border-left: 3px solid transparent; }
.qi:hover { background: #f6f9ff; }
.qi.on { background: var(--primary-weak); border-left-color: var(--primary); }
.qi .txt { color: var(--ink); font-size: 12.5px; }
.qi.done .txt { color: var(--muted); }
.thread { display: grid; gap: 10px; }
.msg { display: flex; gap: 10px; }
.msg .bub { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; max-width: 560px; }
.msg.brand { flex-direction: row-reverse; }
.msg.brand .bub { background: var(--primary-weak); border-color: #cfe0fc; }
.typecard { padding: 10px 12px; border-top: 3px solid var(--line-2); }
.typecard .n { font-size: 20px; font-weight: 750; }

/* ---------- tickets ---------- */
.steps { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
.step { border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: 11.5px; background: var(--surface); }
.step .k { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--line); color: var(--ink-2); margin-bottom: 4px; }
.step.done { border-color: #c4e8cd; background: var(--good-weak); }
.step.done .k { background: var(--good); color: #fff; }
.step.cur { border-color: var(--primary); background: var(--primary-weak); }
.step.cur .k { background: var(--primary); color: #fff; }
.clock { display: grid; grid-template-columns: repeat(20, 1fr); gap: 2px; }
.clock i { height: 16px; border-radius: 2px; background: var(--line); }
.clock i.used { background: var(--good); }
.clock i.used.warn { background: var(--warn); }
.clock i.used.crit { background: var(--crit); }
.clock i.ext { background: #fde8c8; }
.clock i.ext.used { background: var(--serious); }
.kv { display: grid; grid-template-columns: minmax(84px, 150px) minmax(0, 1fr); gap: 6px 12px; font-size: 12.5px; }
.kv dd { overflow-wrap: anywhere; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; }
.timeline { display: grid; gap: 0; }
.tl { display: grid; grid-template-columns: 16px 1fr; gap: 10px; padding-bottom: 12px; position: relative; }
.tl::before { content: ""; position: absolute; left: 7px; top: 14px; bottom: 0; width: 2px; background: var(--line); }
.tl:last-child::before { display: none; }
.tl .d { width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--primary); background: #fff; margin-top: 2px; }

/* ---------- compliance ---------- */
.checkrow { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 12.5px; }
.checkrow:last-child { border-bottom: 0; }
.ok-i { color: var(--good); } .bad-i { color: var(--crit); } .warn-i { color: var(--warn-ink); }
.verdict { margin-top: 10px; padding: 9px 12px; border-radius: 8px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.verdict.ok { background: var(--good-weak); color: var(--good-ink); }
.verdict.bad { background: var(--crit-weak); color: var(--crit-ink); }
.verdict.route { background: var(--warn-weak); color: var(--warn-ink); }
.preview-text { white-space: pre-wrap; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); min-height: 60px; font-size: 13px; }

/* ---------- library ---------- */
.assets { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.asset { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); cursor: pointer; display: flex; flex-direction: column; }
.asset:hover { border-color: var(--primary); box-shadow: var(--shadow); }
.asset .th { aspect-ratio: 4/3; position: relative; overflow: hidden; }
.asset .th svg, .asset .th img { width: 100%; height: 100%; display: block; object-fit: cover; }
.asset .th .tag { position: absolute; top: 8px; left: 8px; }
.asset .meta { padding: 8px 10px 10px; display: grid; gap: 4px; }
.asset .meta .t { font-weight: 650; font-size: 12.5px; line-height: 1.35; }

/* ---------- network rings ---------- */
.rings-wrap { display: grid; grid-template-columns: minmax(280px, 420px) 1fr; gap: 18px; align-items: center; }
.circle-card { display: grid; grid-template-columns: 32px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.circle-card .k { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; }

/* ---------- gantt ---------- */
.gantt { display: grid; grid-template-columns: 220px repeat(9, 1fr); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); position: relative; min-width: 820px; }
.gantt > div { padding: 7px 8px; border-bottom: 1px solid var(--line); font-size: 12px; min-height: 36px; }
.gantt .gh { background: var(--surface-2); font-weight: 650; text-align: center; color: var(--ink-2); }
.gantt .gl { font-weight: 600; }
.gantt .gl small { display: block; color: var(--muted); font-weight: 500; }
.gantt .bar { border-radius: 4px; height: 18px; margin-top: 3px; }

@media (max-width: 1280px) {
  .care { grid-template-columns: 340px minmax(0, 1fr); }
  .care > .side { grid-column: 1 / -1; }
  .g6 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 1000px) {
  .body { grid-template-columns: minmax(0, 1fr); }
  .nav { display: none; }
  .g3, .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .care { grid-template-columns: 1fr; }
  .rings-wrap { grid-template-columns: 1fr; }
  .search, .ws .wsn { display: none; }
  body.has-drawer .main { margin-right: 0; }
  .steps { grid-template-columns: repeat(4, 1fr); }
}
@media (max-width: 640px) {
  .brand small, .env, .ai-badge, .topbar label .muted, .topbar .lbl, .topbar > .av { display: none; }
  .topbar { gap: 6px; padding: 0 10px; }
  .role-sel { max-width: 130px; }
  .callout { flex-wrap: wrap; }
  .grid[style*="grid-template-columns"] { grid-template-columns: 1fr !important; }
  .g2, .g3, .g4, .g6 { grid-template-columns: 1fr; }
  .page { padding: 14px 16px 32px; }
  .drawer { width: 100%; }
  .span2 { grid-column: auto; }
}

</style>
</head>

/* ---------- tooltip ---------- */
let tipEl;
function initTip() {
  tipEl = document.createElement('div'); tipEl.className = 'chart-tip'; document.body.appendChild(tipEl);
  document.addEventListener('mousemove', e => {
    const t = e.target.closest && e.target.closest('[data-tip]');
    if (!t) { tipEl.style.display = 'none'; return; }
    tipEl.innerHTML = t.getAttribute('data-tip');
    tipEl.style.display = 'block';
    const r = tipEl.getBoundingClientRect();
    let x = e.clientX + 14, y = e.clientY + 14;
    if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
    if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
    tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
  });
}

/* ---------- charts ---------- */
function hbars(rows, o = {}) {
  const max = o.max || Math.max(1, ...rows.map(r => r.value));
  const fmt = o.fmt || fmtN;
  return `<div class="hbars">${rows.map(r => `<div class="hbar" data-tip="${esc(r.label)}: <b>${esc(fmt(r.value))}</b>${r.tip ? '<br>' + esc(r.tip) : ''}"><span class="lab">${r.html || esc(r.label)}</span><span class="trk"><i style="width:${(r.value / max * 100).toFixed(1)}%;${r.color ? 'background:' + r.color : (o.color ? 'background:' + o.color : '')}"></i></span><span class="val">${esc(fmt(r.value))}</span></div>`).join('')}</div>`;
}
function donut(segs, o = {}) {
  const size = o.size || 150, r = size / 2 - 12, c = size / 2, sw = o.sw || 22;
  const tot = segs.reduce((a, s) => a + s.value, 0) || 1;
  let a0 = -Math.PI / 2; const gap = 0.025;
  const arcs = segs.map(s => {
    const frac = s.value / tot; const a1 = a0 + frac * Math.PI * 2;
    const st = a0 + (frac > 0.03 ? gap : 0), en = a1 - (frac > 0.03 ? gap : 0);
    const large = en - st > Math.PI ? 1 : 0;
    const p = frac <= 0 ? '' : frac >= 0.999 ? `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${sw}"/>` :
      `<path d="M${c + r * Math.cos(st)},${c + r * Math.sin(st)} A${r},${r} 0 ${large} 1 ${c + r * Math.cos(en)},${c + r * Math.sin(en)}" fill="none" stroke="${s.color}" stroke-width="${sw}" data-tip="${esc(s.label)}: <b>${(frac * 100).toFixed(1)}%</b> (${fmtN(s.value)})"/>`;
    a0 = a1; return p;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(o.label || 'donut chart')}">${arcs}<text x="${c}" y="${c - 2}" text-anchor="middle" font-size="22" font-weight="750" fill="var(--ink)">${esc(o.center || '')}</text><text x="${c}" y="${c + 16}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(o.sub || '')}</text></svg>`;
}
function lineChart(series, o = {}) {
  // series: [{name,color,values:[..]}], labels: o.labels
  const W = o.w || 560, H = o.h || 180, pl = 40, pr = 12, pt = 10, pb = 24;
  const all = series.flatMap(s => s.values); const max = (o.max || Math.max(...all, 1)) * 1.12;
  const n = o.labels.length; const x = i => pl + (W - pl - pr) * (n === 1 ? 0.5 : i / (n - 1)); const y = v => pt + (H - pt - pb) * (1 - v / max);
  const ticks = 4; let grid = '';
  for (let i = 0; i <= ticks; i++) { const v = max / 1.12 * i / ticks; grid += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="#e1e0d9" stroke-width="1"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${esc((o.fmt || fmtK)(v))}</text>`; }
  const step = Math.ceil(n / 7);
  const xl = o.labels.map((l, i) => i % step === 0 || i === n - 1 ? `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(l)}</text>` : '').join('');
  const paths = series.map(s => {
    const d = s.values.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
    const area = o.area ? `<path d="${d}L${x(n - 1)},${y(0)}L${x(0)},${y(0)}Z" fill="${s.color}" opacity=".10"/>` : '';
    const last = s.values.length - 1;
    return `${area}<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/><circle cx="${x(last)}" cy="${y(s.values[last])}" r="4" fill="${s.color}" stroke="#fff" stroke-width="2"/>`;
  }).join('');
  const hits = o.labels.map((l, i) => `<rect x="${x(i) - (W - pl - pr) / n / 2}" y="${pt}" width="${(W - pl - pr) / n}" height="${H - pt - pb}" fill="transparent" data-tip="<b>${esc(l)}</b><br>${series.map(s => esc(s.name) + ': ' + esc((o.fmt || fmtN)(s.values[i]))).join('<br>')}"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.label || 'line chart')}" style="max-height:${H + 20}px">${grid}<line x1="${pl}" x2="${W - pr}" y1="${y(0)}" y2="${y(0)}" stroke="#c3c2b7"/>${xl}${paths}${hits}</svg>`;
}
function funnel(stages) {
  const ramp = ['#86b6ef', '#5598e7', '#2a78d6', '#1c5cab', '#104281'];
  const max = stages[0].value || 1;
  return `<div class="stack">${stages.map((s, i) => `<div data-tip="${esc(s.label)}: <b>${fmtN(s.value)}</b>${i ? '<br>' + pct(s.value / stages[i - 1].value) + ' of previous stage' : ''}"><div class="row between small"><span class="ink2">${esc(s.label)}</span><b class="num">${fmtK(s.value)}</b></div><div style="height:16px;margin-top:3px;border-radius:0 4px 4px 0;width:${Math.max(2, Math.sqrt(s.value / max) * 100).toFixed(1)}%;background:${ramp[i % ramp.length]}"></div></div>`).join('')}</div><div class="note">Bar length uses a square-root scale so small stages stay visible; exact values are labelled.</div>`;
}

/* ---------- modal & toast ---------- */
function openModal(title, body, foot = '', cls = '') {
  closeModal();
  const o = document.createElement('div'); o.className = 'overlay'; o.id = 'modal';
  o.innerHTML = `<div class="modal ${cls}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="mh"><h3>${title}</h3><button class="iconbtn" data-act="close-modal" aria-label="Close">${icon('x')}</button></div><div class="mb">${body}</div>${foot ? `<div class="mf">${foot}</div>` : ''}</div>`;
  o.addEventListener('mousedown', e => { if (e.target === o) closeModal(); });
  document.body.appendChild(o);
  const f = o.querySelector('input,textarea,select'); if (f) setTimeout(() => f.focus(), 30);
}
function closeModal() { const m = $('#modal'); if (m) m.remove(); }
function toast(msg, ic = 'check') {
  let w = $('.toasts'); if (!w) { w = document.createElement('div'); w.className = 'toasts'; document.body.appendChild(w); }
  while (w.children.length >= 3) w.firstChild.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = `${icon(ic, 15)}<span>${msg}</span>`; w.appendChild(t);
  setTimeout(() => t.remove(), 4200);
}
async function copyText(txt) {
  try { await navigator.clipboard.writeText(txt); toast('Copied to clipboard'); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Copied to clipboard'); } catch (e2) { toast('Copy was blocked by the browser. Select the text and copy it manually.', 'alert'); }
    ta.remove();
  }
}

/* ---------- OJK working-day clock (POJK 22/2023) ---------- */
function isWorkday(d) { d = new Date(d); const w = d.getDay(); return w !== 0 && w !== 6 && !HOLIDAYS.includes(dKey(d)); }
function addWorkdays(ts, n) { let d = startOfDay(ts); let c = 0; while (c < n) { d = new Date(d.getTime() + DAY); if (isWorkday(d)) c++; } d.setHours(23, 59, 0, 0); return d.getTime(); }
function workdaysBetween(a, b) { let d = startOfDay(a), end = startOfDay(b), c = 0; while (d < end) { d = new Date(d.getTime() + DAY); if (isWorkday(d)) c++; } return c; }

function clockOf(t) {
  if (!t.docsAt) return { state: 'nodocs', used: 0, total: 10, label: 'Clock starts when documents are complete', left: null };
  const total = t.extended ? 20 : 10;
  const endTs = t.closedAt || Date.now();
  const used = Math.min(total + 5, workdaysBetween(t.docsAt, endTs));
  const dl = deadlineOf(t);
  const left = total - used;
  const done = !!t.closedAt;
  let state = 'ok';
  if (done) state = t.closedAt <= dl ? 'met' : 'missed';
  else if (Date.now() > dl) state = 'overdue';
  else if (left <= 2) state = 'risk';
  const label = done ? (state === 'met' ? `Closed in ${used} of ${total} working days` : `Closed late (${used} working days)`) : state === 'overdue' ? `Overdue by ${used - total} working day${used - total === 1 ? '' : 's'}` : `Day ${Math.max(1, used)} of ${total} working days`;
  return { state, used, total, left, dl, label };
}

ACT['cal-nav'] = el => { const d = +el.dataset.d; S.ui.calWeek = d === 0 ? null : calWeek() + d * 7 * DAY; render(); };
ACT['cal-stagger'] = () => {
  const ws = calWeek(); const order = ['ig_main', 'tt_main', 'fb_main', 'x_main', 'th_main', 'ig_km', 'ig_sy', 'ig_hy'];
  let moved = 0, span = 0;
  Object.keys(CAMPAIGNS).filter(k => CAMPAIGNS[k].clash).forEach(camp => {
    const ps = S.posts.filter(p => p.camp === camp && p.at >= ws && p.at < ws + 7 * DAY);
    if (ps.length < 2) return;
    const planner = S.role === 'brand' || S.role === 'compliance';
    const fixed = ps.filter(p => p.status === 'published' || (!planner && !canPublish(p.acc)));
    const movable = ps.filter(p => !fixed.includes(p)).sort((a, b) => order.indexOf(a.acc) - order.indexOf(b.acc));
    if (!movable.length) return;
    const taken = new Set(fixed.map(p => dKey(p.at)));
    const startDay = Math.max(startOfDay(Math.min(...movable.map(p => p.at))).getTime(), startOfDay(Date.now() + DAY).getTime());
    let d = startDay; const used = [];
    movable.forEach(p => {
      let guard = 0; while (taken.has(dKey(d)) && guard++ < 14) d += DAY;
      const t = new Date(p.at); const nd = new Date(d); nd.setHours(t.getHours(), t.getMinutes(), 0, 0);
      if (nd.getTime() < Date.now()) nd.setTime(Date.now() + 3600000);
      if (nd.getTime() !== p.at) moved++;
      p.at = nd.getTime(); taken.add(dKey(d)); used.push(dKey(d)); d += DAY;
    });
    span = Math.max(span, new Set([...used, ...fixed.map(p => dKey(p.at))]).size);

  render();
};

VIEWS.compliance = () => {
  const tab = S.ui.cTab || 'try';
  const isC = S.role === 'compliance';
  const queue = [...S.tasks.filter(t => t.status === 'review').map(t => ({ k: 'Task', id: t.id, title: t.name, by: t.creator, product: t.product, text: t.template })), ...S.assets.filter(a => a.status === 'Pending review').map(a => ({ k: 'Library asset', id: a.id, title: a.title, by: a.source || 'Brand team', product: a.product, text: a.title })), ...S.posts.filter(p => p.status === 'draft').map(p => ({ k: 'Calendar post', id: p.id, title: p.title + ' · ' + accById(p.acc).handle, by: 'Brand team', product: p.product, text: p.caption }))];
  const blocked = S.audit.filter(a => a.result === 'Blocked').length;
  const tabs = [['try', 'Try the AI check'], ['queue', `Review queue ${queue.length ? `<span class="badge blue">${queue.length}</span>` : ''}`], ['rules', 'Check rules'], ['kol', 'POJK 6/2026 creator register'], ['audit', 'Audit log']];
  let body = '';
  if (tab === 'try') {
    const cur = S.ui.cTry || { t: PRESETS[0].t, product: PRESETS[0].product, paid: true };
    body = `<div class="grid" style="grid-template-columns:1fr 1.1fr;gap:14px"><div class="card"><div class="bd stack">
      <div class="row wrap">${PRESETS.map((p, i) => `<button class="btn sm" data-act="c-preset" data-i="${i}">${esc(p.l)}</button>`).join('')}</div>
      <label class="fl">Caption or reply<textarea class="input" id="c-txt" data-input="c-run" rows="6">${esc(cur.t)}</textarea></label>
      <div class="grid g3"><label class="fl">Product tag<select class="input" id="c-prod" data-change="c-run">${Object.keys(PRODUCTS).map(k => `<option ${k === cur.product ? 'selected' : ''}>${k}</option>`).join('')}</select></label>
      <label class="fl">Paid / rewarded<select class="input" id="c-paid" data-change="c-run"><option value="1" ${cur.paid ? 'selected' : ''}>Yes · disclosure required</option><option value="0" ${cur.paid ? '' : 'selected'}>No</option></select></label>
      <label class="fl">Type<select class="input" id="c-kind" data-change="c-run"><option value="caption">Post caption</option><option value="reply">Care reply</option></select></label></div>
      <div class="row"><button class="btn" data-act="c-fix">${icon('wand', 14)}Auto-fix suggestions</button><button class="btn primary" data-act="c-log">${icon('shield', 14)}Run & log check</button></div>
      <div class="note">Highlighted words are flagged by the AI. Check rules are configured with CIMB Niaga Compliance in week 0; the same prohibited-promise rules can be shared with Echo’s branch conversation scoring.</div>
    </div></div><div id="c-out"></div></div>
    <div class="grid g3 mt12">${[['Guaranteed returns', '“pasti untung”, “dijamin aman”, “bunga pasti”'], ['Missing disclosure', 'Paid task without #iklan or partnership label'], ['Missing risk warning', 'Investment, insurance or pay-later post with no risk wording'], ['Wrong product facts', 'Rate, fee or tenor different from the product sheet'], ['Personal data in view', 'KTP, card or account numbers, customer faces without consent'], ['Off-brand or risky tone', 'Attacks on competitors, politics, SARA topics']].map(([a, b]) => `<div class="card" style="padding:12px 14px"><div class="row"><span class="bad-i">${icon('alert', 16)}</span><b>${a}</b></div><div class="small ink2 mt8">${b}</div></div>`).join('')}</div>`;
  } else if (tab === 'queue') {
    body = queue.length ? `<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Item</th><th>Type</th><th>Product</th><th>From</th><th>AI check</th><th></th></tr></thead><tbody>${queue.map(q => { const c = checkCompliance(q.text || q.title, { product: q.product, paid: true, disclosure: true }); return `<tr><td><b>${esc(q.title)}</b><div class="tiny muted">${esc((q.text || '').slice(0, 110))}</div></td><td>${q.k}</td><td>${esc(q.product || '—')}${PRODUCTS[q.product] && PRODUCTS[q.product].risk ? ` <span class="pill warn">${RISK_WORDING[PRODUCTS[q.product].risk].label}</span>` : ''}</td><td class="small">${esc(q.by)}</td><td>${verdictPill(c.verdict)}</td><td><div class="row">${isC ? `<button class="btn sm" data-act="cq-no" data-k="${q.k}" data-id="${q.id}">Return</button><button class="btn sm primary" data-act="cq-ok" data-k="${q.k}" data-id="${q.id}">Approve</button>` : '<span class="small muted">Compliance only</span>'}</div></td></tr>`; }).join('')}</tbody></table></div></div>` : '<div class="card"><div class="empty">Nothing waiting for Compliance.</div></div>';
  } else if (tab === 'rules') {
    body = `<div class="grid" style="grid-template-columns:1.3fr 1fr;gap:14px"><div class="card"><div class="hd"><h3>Check rules</h3><span class="sub">${isC ? 'You can edit these' : 'View only · Compliance & Legal edits rules'}</span></div><div class="bd stack">
      ${S.rules.map(r => `<div class="card" style="padding:10px 12px"><div class="row between"><div><b>${esc(r.name)}</b><div class="small ink2">${esc(r.desc)}</div></div><div class="row"><select class="input" style="width:auto;padding:3px 6px" data-change="rule-sev" data-id="${r.id}" ${isC ? '' : 'disabled'} aria-label="Severity"><option value="block" ${r.sev === 'block' ? 'selected' : ''}>Block</option><option value="warn" ${r.sev === 'warn' ? 'selected' : ''}>Warn only</option>${r.id === 'route' ? `<option value="route" selected>Route to Compliance</option>` : ''}</select><button class="switch ${r.on ? 'on' : ''}" data-act="rule-on" data-id="${r.id}" aria-label="Turn rule ${r.on ? 'off' : 'on'}" ${isC ? '' : 'disabled'}></button></div></div>
      ${r.words ? `<label class="fl mt8">Words and phrases<textarea class="input small" rows="2" data-change="rule-words" data-id="${r.id}" ${isC ? '' : 'disabled'}>${esc(r.words.join(', '))}</textarea></label>` : ''}</div>`).join('')}
    </div></div>
    <div class="stack"><div class="card"><div class="hd"><h3>Required risk wording</h3><span class="sub">inserted automatically</span></div><div class="bd stack">${Object.entries(RISK_WORDING).map(([k, w]) => `<div><span class="pill warn">${w.label}</span><div class="preview-text small mt8">${esc(w.text)}</div></div>`).join('')}</div></div>
    <div class="card"><div class="hd"><h3>What OJK requires (POJK 6/2026)</h3></div><div class="bd"><table class="tbl"><tbody>${[['Disclose any economic interest (fees, commissions, affiliate benefits)', 'Disclosure tag required in every paid task; AI blocks posts without it'], ['Information clear, accurate, honest, not misleading', 'Captions built from the approved library; facts checked against the product sheet'], ['No guaranteed profits that don’t fit the product', 'AI flags “pasti untung”, “dijamin” before posting'], ['Risk warnings for high-risk or complex products and pay-later', 'Risk wording inserted automatically for those product tags'], ['Only authorised products; no unsupported comparisons', 'Product list and comparison rules set by Compliance'], ['Existing influencer deals aligned within 6 months', 'One register of every creator, brief, post and payment']].map(([a, b]) => `<tr><td class="small">${a}</td><td class="small b">${b}</td></tr>`).join('')}</tbody></table><div class="note">Source: Bisnis.com, 24 June 2026, on POJK 6/2026. Summary only; CIMB Niaga Compliance and Legal confirm how the rule applies.</div></div></div></div></div>`;
  } else if (tab === 'kol') {
    const kols = S.advocates.filter(a => a.circle === 'KOL');
    body = `<div class="callout warn" style="margin-bottom:12px">${icon('clock', 18)}<div><b>Alignment window:</b> OJK reported POJK 6/2026 in June 2026; financial institutions must align existing influencer arrangements within six months (around December 2026, exact date confirmed by Legal). ${kols.filter(k => k.kol.contract !== 'Aligned').length} of ${kols.length} creator contracts still need updating.</div></div>
    <div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Creator</th><th>Niche</th><th class="n">Followers</th><th>Contract</th><th class="n">Briefs posted</th><th>Disclosure on every post</th><th class="n">Paid to date</th><th class="n">Fee / post</th><th></th></tr></thead><tbody>
    ${kols.map(k => { const posts = S.tasks.filter(t => t.paid).flatMap(t => t.exec.filter(e => e.adv === k.id && e.st === 'done')); return `<tr><td><span class="who">${av(k.name, 24, '#eb6834')}<b>${esc(k.name)}</b></span></td><td class="small">${esc(k.unit)}</td><td class="n">${fmtK(k.followers)}</td><td>${k.kol.contract === 'Aligned' ? '<span class="pill good">Aligned with POJK 6/2026</span>' : '<span class="pill warn">Needs update</span>'}</td><td class="n">${posts.length}</td><td>${posts.length ? '<span class="pill good">' + icon('check', 11) + ' 100% #iklan</span>' : '<span class="muted small">no posts yet</span>'}</td><td class="n">${rp(k.kol.paidTotal)}</td><td class="n">${rp(k.kol.fee)}</td><td>${k.kol.contract !== 'Aligned' && isC ? `<button class="btn sm" data-act="kol-align" data-id="${k.id}">Mark aligned</button>` : ''}</td></tr>`; }).join('')}
    </tbody></table></div></div><p class="note">Sample creators. One register of every creator, brief, post and payment for audit; paid posts without disclosure are blocked before publishing.</p>`;
  } else {
    body = `<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Time</th><th>Source</th><th>Text checked</th><th>Result</th><th>Issues</th><th>By</th></tr></thead><tbody>${S.audit.slice(0, 120).map(a => `<tr><td class="small num">${fmtDT(a.at)}</td><td class="small">${esc(a.src)}</td><td class="small" style="max-width:380px">${esc(a.text)}</td><td>${a.result === 'Ready' ? '<span class="pill good">Ready</span>' : a.result === 'Blocked' ? '<span class="pill crit">Blocked</span>' : '<span class="pill warn">Sent to Compliance</span>'}</td><td class="small">${esc(a.issues.join(', ') || '—')}</td><td class="small">${esc(a.by)}</td></tr>`).join('')}</tbody></table></div></div><p class="note">Every post, reply and version is saved with its check result for audit. Blocked items never publish.</p>`;
  }
  return head('Govern', 'Compliance', 'Every post and reply is checked before it goes out, ready for OJK’s finfluencer rule (POJK 6/2026) and complaint rule (POJK 22/2023).', `<span class="pill good">${icon('check', 12)}Checked before posting: 100%</span><span class="pill">${blocked} blocked · 0 violations published</span>`) +
    `<div class="tabs">${tabs.map(([k, l]) => `<button class="${tab === k ? 'on' : ''}" data-act="tab" data-k="cTab" data-v="${k}">${l}</button>`).join('')}</div>` + body;
};
VIEWS.compliance_after = () => { if ($('#c-out')) ONINPUT['c-run'](); };
function cCtx() { return { product: $('#c-prod').value, paid: $('#c-paid').value === '1', disclosure: $('#c-paid').value === '1', kind: $('#c-kind').value }; }
ONINPUT['c-run'] = ONCHANGE['c-run'] = () => { const t = $('#c-txt').value; const c = cCtx(); S.ui.cTry = { t, product: c.product, paid: c.paid }; $('#c-out').innerHTML = checkPanel(t, c, 'Result'); };
ACT['c-preset'] = el => { const p = PRESETS[+el.dataset.i]; $('#c-txt').value = p.t; $('#c-prod').value = p.product; $('#c-paid').value = p.paid ? '1' : '0'; ONINPUT['c-run'](); };
ACT['c-fix'] = () => { $('#c-txt').value = autoFix($('#c-txt').value, cCtx()); ONINPUT['c-run'](); toast('Auto-fix applied: review the wording, then run the check again', 'wand'); };
ACT['c-log'] = () => { const t = $('#c-txt').value; const chk = checkCompliance(t, cCtx()); logAudit('Compliance · manual check', t, chk); toast('Logged: ' + (chk.verdict === 'ready' ? 'Ready to publish' : chk.verdict === 'route' ? 'Sent to Compliance' : `Blocked (${chk.blocking.length} issues)`), 'shield'); };
ACT['rule-on'] = el => { if (S.role !== 'compliance') { toast('Only Compliance & Legal can change check rules', 'lock'); return; } const r = S.rules.find(x => x.id === el.dataset.id); r.on = !r.on; toast(`${r.name}: ${r.on ? 'on' : 'off'}`); render(); };
ONCHANGE['rule-sev'] = el => { const r = S.rules.find(x => x.id === el.dataset.id); r.sev = el.value; toast(`${r.name}: ${el.value}`); };
ONCHANGE['rule-words'] = el => { const r = S.rules.find(x => x.id === el.dataset.id); r.words = el.value.split(',').map(s => s.trim()).filter(Boolean); toast(`${r.name}: ${r.words.length} words saved`); };
ACT['cq-ok'] = el => { const { k, id } = el.dataset; if (k === 'Task') ACT['task-approve']({ dataset: { id } }); else if (k === 'Library asset') { assetById(id).status = 'Cleared'; toast('Asset approved'); render(); } else { const p = S.posts.find(x => x.id === id); p.status = 'scheduled'; logAudit('Compliance approval · post', p.caption, { verdict: 'ready', res: [] }); toast('Post approved and scheduled'); render(); } };
ACT['cq-no'] = el => { const { k, id } = el.dataset; if (k === 'Task') taskById(id).status = 'draft'; else if (k === 'Library asset') assetById(id).status = 'Rejected'; else S.posts = S.posts.filter(p => p.id !== id); toast('Returned with comments', 'x'); render(); };
ACT['kol-align'] = el => { const a = advById(el.dataset.id); a.kol.contract = 'Aligned'; toast(a.name + ' contract aligned with POJK 6/2026'); render(); };

/* ---------- Voice network ---------- */
function ringsSVG() {
  const c = { KOS: S.advocates.filter(a => a.circle === 'KOS'), KOC: S.advocates.filter(a => a.circle === 'KOC'), KOL: S.advocates.filter(a => a.circle === 'KOL') };
  const R = { KOS: 92, KOC: 132, KOL: 170 }; let dots = '';
  Object.entries(c).forEach(([k, arr]) => { const n = Math.min(arr.length, k === 'KOS' ? 60 : k === 'KOC' ? 40 : 8); for (let i = 0; i < n; i++) { const a = arr[Math.floor(i * arr.length / n)]; const ang = i / n * Math.PI * 2 + (k === 'KOC' ? .2 : k === 'KOL' ? .5 : 0); dots += `<circle cx="${190 + R[k] * Math.cos(ang)}" cy="${190 + R[k] * Math.sin(ang)}" r="${k === 'KOL' ? 6 : 4}" fill="${a.optIn ? CIRCLES[k].color : '#c9ced8'}" stroke="#fff" stroke-width="1.5" data-tip="${esc(a.name)} · ${k}<br>${esc(a.unit)}${a.optIn ? '' : '<br>opted out'}"/>`; } });
  return `<svg viewBox="0 0 380 380" width="100%" style="max-width:400px" role="img" aria-label="Voice network rings">${Object.entries(R).map(([k, r]) => `<circle cx="190" cy="190" r="${r}" fill="none" stroke="${CIRCLES[k].color}" stroke-opacity=".35" stroke-dasharray="3 4"/>`).join('')}${dots}<circle cx="190" cy="190" r="58" fill="#1d2433"/><text x="190" y="186" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Official accounts</text><text x="190" y="204" text-anchor="middle" fill="#9fb0cc" font-size="10">Lume console</text></svg>`;
}
VIEWS.network = () => {
  const cf = S.ui.netC || 'all', rf = S.ui.netR || 'all', q = (S.ui.netQ || '').toLowerCase(), pg = S.ui.netPg || 0;
  const done = {}; S.tasks.forEach(t => t.exec.forEach(e => { if (e.st === 'done') { const d = done[e.adv] = done[e.adv] || { tasks: 0, posts: 0, views: 0, clicks: 0 }; d.tasks++; d.posts += e.plats.length; d.views += e.views; d.clicks += e.clicks; } }));
  const list = S.advocates.filter(a => (cf === 'all' || a.circle === cf) && (rf === 'all' || a.region === rf) && (!q || (a.name + ' ' + a.unit).toLowerCase().includes(q)));
  const per = 20, pages = Math.ceil(list.length / per);
  const cnt = k => { const arr = S.advocates.filter(a => a.circle === k); return { n: arr.length, opt: arr.filter(a => a.optIn).length, act: arr.filter(a => done[a.id]).length }; };
  return head('Network', 'Voice network', 'Four circles of voices, one command centre. Real, named employees, members and creators, openly connected to CIMB Niaga. Participation is opt-in.', `<button class="btn primary" data-act="invite">${icon('users', 14)}Invite advocates</button>`) +
    `<div class="rings-wrap card" style="padding:16px">${ringsSVG()}<div class="stack">
      <div class="circle-card"><span class="k" style="background:#1d2433">1</span><div><b>${CIRCLES.OFF.name}</b><div class="small ink2">${CIRCLES.OFF.desc}</div><div class="small b" style="color:#1d2433">${CIRCLES.OFF.act}</div></div><b class="num">${S.accounts.length}</b></div>
      ${['KOS', 'KOC', 'KOL'].map(k => { const c = cnt(k); return `<div class="circle-card"><span class="k" style="background:${CIRCLES[k].color}">${CIRCLES[k].n}</span><div><b>${CIRCLES[k].name}</b><div class="small ink2">${CIRCLES[k].desc}</div><div class="small b" style="color:${CIRCLES[k].color}">${CIRCLES[k].act}</div></div><div style="text-align:right"><b class="num">${c.n}</b><div class="tiny muted">${c.opt} opted in · ${c.act} active</div></div></div>`; }).join('')}
      <div class="tiny muted">KOS: key opinion sales (employees) · KOC: key opinion consumers (community) · KOL: key opinion leaders (creators). Pilot: ~300 employee advocates in 20 branches, ~100 KejarMimpi ambassadors, 5–10 creators.</div>
    </div></div>
    <div class="grid mt12" style="grid-template-columns:1fr 1.6fr;gap:14px">
      <div class="card"><div class="hd"><h3>Transparent amplification, not buzzers</h3></div><div class="bd"><table class="tbl"><thead><tr><th></th><th style="color:var(--crit-ink)">✗ Buzzer model</th><th style="color:var(--good-ink)">✓ Lume voice network</th></tr></thead><tbody>${[['Who posts', 'Anonymous or fake accounts', 'Real, named employees, members and creators'], ['Payment', 'Hidden', 'Disclosed: #iklan, “paid partnership” labels'], ['What they say', 'Off-script, sometimes misleading', 'From the approved library, checked by AI before posting'], ['Measurement', 'Bought likes; no link to results', 'Every post tracked to clicks and OCTO sign-ups'], ['Risk', 'Takedowns, OJK sanctions, reputation', 'Aligned with POJK 6/2026 and POJK 22/2023']].map(r => `<tr><td class="b small">${r[0]}</td><td class="small muted">${r[1]}</td><td class="small">${r[2]}</td></tr>`).join('')}</tbody></table><p class="small b" style="color:var(--primary);margin:10px 0 0">For a bank, trust is the product.</p></div></div>
      <div class="card"><div class="hd"><h3>Advocates</h3><span class="sub">${list.length} people</span></div><div class="bd" style="padding-top:8px">
        <div class="row wrap" style="margin-bottom:8px"><div class="seg">${[['all', 'All'], ['KOS', 'KOS'], ['KOC', 'KOC'], ['KOL', 'KOL']].map(([k, l]) => `<button class="${cf === k ? 'on' : ''}" data-act="net-f" data-k="netC" data-v="${k}">${l}</button>`).join('')}</div><select class="input" style="width:auto;padding:4px 8px" data-change="net-r" aria-label="Region"><option value="all">All regions</option>${REGIONS.map(r => `<option ${rf === r ? 'selected' : ''}>${r}</option>`).join('')}</select><div class="search" style="width:200px">${icon('search', 13)}<input placeholder="Name or branch" value="${esc(S.ui.netQ || '')}" data-input="net-q" aria-label="Search advocates"></div></div>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Name</th><th>Circle</th><th>Branch / unit</th><th>Accounts</th><th class="n">Tasks</th><th class="n">Reach</th><th class="n">Points</th><th>Opt-in</th></tr></thead><tbody>
        ${list.slice(pg * per, pg * per + per).map(a => { const d = done[a.id] || { tasks: 0, views: 0 }; return `<tr><td><span class="who">${av(a.name, 22)}<span><b class="small">${esc(a.name)}</b><br><span class="tiny muted">${esc(a.title)}</span></span></span></td><td><span class="pill" style="color:${CIRCLES[a.circle].color}">${a.circle}</span></td><td class="small">${esc(a.unit)}</td><td><span class="row" style="gap:3px">${Object.entries(a.acc).filter(([, v]) => v).map(([p]) => plat(p, 15)).join('')}</span></td><td class="n">${d.tasks}</td><td class="n">${fmtK(d.views)}</td><td class="n">${fmtN(a.points)}</td><td><button class="switch ${a.optIn ? 'on' : ''}" data-act="adv-opt" data-id="${a.id}" aria-label="Opt-in"></button></td></tr>`; }).join('')}
        </tbody></table></div>
        ${pages > 1 ? `<div class="row mt12" style="justify-content:flex-end;flex-wrap:wrap">${[...Array(Math.min(pages, 21))].map((_, i) => `<button class="btn sm ${i === pg ? 'primary' : ''}" data-act="net-pg" data-v="${i}">${i + 1}</button>`).join('')}</div>` : ''}
        <p class="note">Personal accounts stay personal: Lume reads post-level results of task posts only, with consent. Opt in or out at any time.</p>
      </div></div>
    </div>`;
};

ONCHANGE['net-r'] = el => { S.ui.netR = el.value; S.ui.netPg = 0; render(); };

/* ---------- Pilot scorecard ---------- */
function scorecard() {
  const invited = S.advocates.filter(a => a.invited);
  const posted = new Set(); S.tasks.forEach(t => t.exec.forEach(e => { if (e.st === 'done') posted.add(e.adv); }));
  const part = invited.filter(a => posted.has(a.id)).length / invited.length;
  const due = S.tasks.filter(t => t.deadline < Date.now() && t.status !== 'draft');
  const dueEx = due.flatMap(t => t.exec.filter(e => e.st !== 'optout'));
  const exe = dueEx.filter(e => e.st === 'done' && e.onTime).length / Math.max(1, dueEx.length);
  const ex = allExec().filter(x => x.e.st === 'done'); const v = ex.reduce((a, x) => a + x.e.views, 0); const it = ex.reduce((a, x) => a + x.e.likes + x.e.comments + x.e.shares, 0);
  const er = it / Math.max(1, v); const mult = er / 0.0003;
  const brand = Object.values(S.brandReach).reduce((a, b) => a + b, 0); const extra = v / brand;
  const withLink = S.tasks.filter(t => t.link).length / S.tasks.length;
  const compl = S.inbox.filter(m => m.ai.type === 'Complaint' && m.firstReplyAt); const frs = compl.map(m => (m.firstReplyAt - m.at) / 60000).sort((a, b) => a - b);
  const fr = frs.length ? frs[Math.floor(frs.length / 2)] : ccStats().med;
  const handledC = S.inbox.filter(m => m.ai.type === 'Complaint' && m.status !== 'new'); const tick = handledC.length ? handledC.filter(m => m.ticketId).length / handledC.length : 1;
  const closed = S.tickets.filter(t => t.closedAt); const res = closed.filter(t => clockOf(t).state === 'met').length / Math.max(1, closed.length);
  const st = ccStats(); const sent = (st.pos - S.listen.baselinePos) * 100;
  const blockedPublished = 0;
  return [
    ['Participation', 'Invited advocates who post at least once', '≥ 60%', pct(part, 0), part >= 0.6],
    ['Execution', 'Tasks completed on time', '≥ 70%', pct(exe, 0), exe >= 0.7],
    ['Compliance', 'Posts and replies checked first / violations published', '100% / 0', `100% / ${blockedPublished}`, true],
    ['Engagement', 'Engagement on advocate posts vs the brand account’s baseline', '≥ 10×', `${Math.round(mult)}× (${pct(er, 1)})`, mult >= 10],
    ['Reach', 'Extra campaign reach from the network vs brand-only', '+30%', '+' + pct(extra, 0), extra >= 0.3],
    ['Results', 'Posts with tracked links to OCTO', '100%', pct(withLink, 0), withLink >= 1],
    ['First reply', 'Complaints answered publicly, service hours', '≤ 1 h', `${Math.round(fr)} min median`, fr <= 60],
    ['Ticketing', 'Social complaints logged as tickets', '100%', `${pct(tick, 0)} of handled`, tick >= 1],
    ['Resolution', 'Social tickets closed within the OJK deadline', '100%', pct(res, 0), res >= 1],
    ['Sentiment', 'Share of positive mentions vs baseline', '+5 pts', (sent >= 0 ? '+' : '') + sent.toFixed(0) + ' pts', Math.round(sent) >= 5]
  ];
}

    let k = 0; const base = adv.circle === 'KOL' ? adv.followers * 0.25 : 1400;
    const iv = setInterval(() => {
      k++; e.views = Math.round(base * k / 4 * P.done.plats.length); e.likes = Math.round(e.views * 0.024); e.comments = Math.round(e.views * 0.004); e.shares = Math.round(e.views * 0.003); e.clicks = Math.round(e.views * 0.0028); e.signups = Math.round(e.clicks * 0.12);
      if (k >= 4) clearInterval(iv);
      const r = parseHash(); if (!$('#modal') && !(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) && (r.r === 'tasks' || r.r === 'insights' || r.r === 'command')) render(); else save();
    }, 6000);
  }, 1400);
};

/* ================= App shell ================= */
const STORE = 'lume-cimb-niaga-v3';
let saveT;
function save() { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) { } }, 250); }
function load() {
  try { const raw = localStorage.getItem(STORE); if (raw) { const st = JSON.parse(raw); if (st && st.v === 3) return st; } } catch (e) { }
  return null;
}
function freshState() { S = seed(); S.inbox.forEach(prepInbox); S.inbox.forEach(m => { if (m.pre != null) { const t = m.at + m.pre * 60000; let text = replyFallback(m); if (m.ai.type === 'Complaint') { const tk = createTicket(m, t); text = text.replace('[dibuat saat dikirim]', tk.id); } m.thread.push({ from: 'brand', at: t, text, by: 'Agus F.' }); m.firstReplyAt = t; m.status = m.ai.type === 'Complaint' ? 'ticketed' : m.ai.type === 'Crisis or viral' ? 'escalated' : 'replied'; delete m.pre; } }); S.phone = phoneInit(); }
function resetDemo() { try { localStorage.removeItem(STORE); } catch (e) { } freshState(); save(); location.hash = '#command'; render(); toast('Demo data reset'); }

/* ---------- AI (Claude via the page's sample capability; templates as fallback) ---------- */
const AI = {
  sample: null,
  async init() {
    for (let i = 0; i < 6 && !(window.claude && window.claude.use); i++) await new Promise(r => setTimeout(r, 500));
    if (!(window.claude && window.claude.use)) return;
    try { const s = await window.claude.use('sample'); if (s) { AI.sample = s; renderTop(); } } catch (e) { }
  },
  get live() { return !!AI.sample; },
  async write(prompt, fallback, onText) {
    if (!AI.sample) return fallback();
    try {
      const r = await AI.sample(prompt, { modelTier: 'quick', onText: onText ? (u => onText(u.text)) : undefined });
      const txt = (r && r.text || '').trim();
      return txt || fallback();
    } catch (e) {
      if (e && e.code === 'not_granted') { AI.sample = null; renderTop(); }
      toast(e && e.code === 'rate_limited' ? 'AI is busy; used the approved template instead' : 'AI unavailable; used the approved template instead', 'alert');
      return fallback();
    }
  }
};

/* ---------- routes ---------- */
const ROUTES = [
  { id: 'command', t: 'Command centre', ic: 'dash', g: 'Overview' },
  { id: 'calendar', t: 'Calendar', ic: 'cal', g: 'Publish' },
  { id: 'tasks', t: 'Mass tasks', ic: 'task', g: 'Publish' },
  { id: 'library', t: 'Library (Harbor)', ic: 'lib', g: 'Publish' },
  { id: 'accounts', t: 'Accounts', ic: 'accounts', g: 'Publish' },
  { id: 'network', t: 'Voice network', ic: 'net', g: 'Network' },
  { id: 'insights', t: 'Insights & points', ic: 'chart', g: 'Network' },
  { id: 'care', t: 'Care desk', ic: 'care', g: 'Listen & resolve' },
  { id: 'tickets', t: 'Social tickets', ic: 'ticket', g: 'Listen & resolve' },
  { id: 'compliance', t: 'Compliance', ic: 'shield', g: 'Govern' },
  { id: 'reports', t: 'OJK reports', ic: 'report', g: 'Govern' },
  { id: 'scorecard', t: 'Pilot scorecard', ic: 'flag', g: 'Govern' }
];
function parseHash() {
  const h = (location.hash || '#command').slice(1);
  if (h.startsWith('task-')) return { r: 'tasks', id: h.slice(5) };
  if (h.startsWith('ticket-')) return { r: 'tickets', id: h.slice(7) };
  if (ROUTES.some(x => x.id === h)) return { r: h };
  return { r: 'command' };
}

function navBadges() {
  const q = S.inbox.filter(m => m.status === 'new').length;
  const risk = S.tickets.filter(t => !t.closedAt && ['risk', 'overdue'].includes(clockOf(t).state)).length;
  const rev = S.tasks.filter(t => t.status === 'review').length + S.assets.filter(a => a.status === 'Pending review').length;
  return { care: q ? `<span class="badge">${q}</span>` : '', tickets: risk ? `<span class="badge" title="At risk of missing the OJK deadline">${risk}</span>` : '', compliance: rev ? `<span class="badge blue">${rev}</span>` : '' };
}
function renderNav() {
  const cur = parseHash().r; const b = navBadges(); let g = ''; let html = '';
  ROUTES.forEach(r => { if (r.g !== g) { html += `<h6>${r.g}</h6>`; g = r.g; } html += `<a href="#${r.id}" class="${cur === r.id ? 'on' : ''}">${icon(r.ic, 17)}<span>${r.t}</span>${b[r.id] || ''}</a>`; });
  html += `<div class="foot">Pilot workspace · PT Bank CIMB Niaga Tbk<br>Sample data for the 8-week pilot. <button class="btn sm ghost" style="padding:0;color:var(--primary)" data-act="reset">Reset demo data</button></div>`;
  $('#nav').innerHTML = html;
}
function renderTop() {
  const un = S.notifs.filter(n => n.unread).length;
  $('#topbar').innerHTML = `
    <div class="brand"><span class="whale">whale</span><span class="lume">Lume</span><small>Harbor 5.6 · Alivia</small></div>
    <div class="ws"><span class="mark">CN</span><span class="wsn">PT Bank CIMB Niaga Tbk</span></div>
    <span class="env">Pilot</span>
    <div class="grow"></div>
    <div class="search" style="position:relative">${icon('search', 14)}<input id="gsearch" placeholder="Search tasks, tickets, assets, people" autocomplete="off" aria-label="Search"></div>
    <span class="ai-badge ${AI.live ? 'live' : ''}" data-tip="${AI.live ? 'Captions, replies and briefs are written live by Claude, then checked by the compliance rules.' : 'Captions and replies come from the approved template library. Live AI writing switches on when this page is opened on claude.ai and you allow it.'}"><i></i>Alivia AI · ${AI.live ? 'live' : 'templates'}</span>
    <button class="iconbtn" data-act="notifs" aria-label="Notifications">${icon('bell', 18)}${un ? `<span class="dot-count">${un}</span>` : ''}</button>
    <button class="btn ${S.ui.drawer ? 'primary' : ''}" data-act="drawer" aria-label="Advocate app">${icon('phone', 15)}<span class="lbl">Advocate app</span></button>
    <label class="row small" style="gap:6px"><span class="muted">Role</span><select class="role-sel" id="rolesel" aria-label="Switch role">${Object.entries(ROLES).map(([k, r]) => `<option value="${k}" ${S.role === k ? 'selected' : ''}>${r.name}</option>`).join('')}</select></label>
    ${av(ROLES[S.role].user, 28)}`;
}
let lastRoute = null;
function render() {
  const p = parseHash();
  document.title = 'Lume for CIMB Niaga';
  renderTop(); renderNav();
  const main = $('#main');
  const keep = lastRoute === location.hash ? main.scrollTop : 0;
  const view = VIEWS[p.r];
  try { main.innerHTML = `<div class="page">${view ? view(p) : ''}</div>`; }
  catch (e) { console.error(e); main.innerHTML = `<div class="page"><div class="callout crit">${icon('alert')}<div>Something went wrong drawing this screen: ${esc(e.message)}. Try <button class="btn sm" data-act="reset">Reset demo data</button>.</div></div></div>`; }
  main.scrollTop = keep; lastRoute = location.hash;
  if (VIEWS[p.r + '_after']) VIEWS[p.r + '_after'](p);
  renderDrawer();
  updateLive();
  save();
}
function rerender() { render(); }
function go(h) { if (location.hash === h) render(); else location.hash = h; }

/* ---------- live timers ---------- */
function updateLive() {
  $$('[data-due]').forEach(el => {
    const due = +el.getAttribute('data-due'); const m = (due - Date.now()) / 60000;
    el.textContent = m >= 0 ? `${durMin(m)} left` : `${durMin(-m)} over`;
    el.className = 'pill ' + (m < 0 ? 'crit' : m < 10 ? 'warn' : '');
  });
}

/* ---------- notifications & search ---------- */
function notify(text, ic, goTo) { S.notifs.unshift({ id: uid('n'), at: Date.now(), ic: ic || 'bell', text, go: goTo || '', unread: true }); if (S.notifs.length > 40) S.notifs.length = 40; }
function closePops() { $$('.popover').forEach(p => p.remove()); }
function showNotifs() {
  closePops();
  const p = document.createElement('div'); p.className = 'popover';
  p.innerHTML = `<div class="row between" style="padding:10px 14px;border-bottom:1px solid var(--line)"><b>Notifications</b><button class="btn sm ghost" data-act="read-all">Mark all read</button></div>` +
    (S.notifs.length ? S.notifs.map(n => `<div class="it" data-act="open-notif" data-id="${n.id}"><span style="color:${n.unread ? 'var(--crit)' : 'var(--muted)'}">${icon(n.ic || 'bell', 16)}</span><div><div style="font-weight:${n.unread ? 650 : 500}">${esc(n.text)}</div><div class="tiny muted">${rel(n.at)}</div></div></div>`).join('') : '<div class="empty">No notifications</div>');
  $('#topbar').appendChild(p);
}
function doSearch(q) {
  closePops(); q = q.trim().toLowerCase(); if (q.length < 2) return;
  const res = [];
  S.tasks.forEach(t => { if (t.name.toLowerCase().includes(q)) res.push({ ic: 'task', t: t.name, s: 'Mass task', go: '#task-' + t.id }); });
  S.tickets.forEach(t => { if ((t.id + ' ' + t.issue + ' ' + t.theme).toLowerCase().includes(q)) res.push({ ic: 'ticket', t: t.id + ' · ' + t.issue, s: 'Social ticket', go: '#ticket-' + t.id }); });
  S.assets.forEach(a => { if ((a.title + ' ' + a.type + ' ' + (a.tags || []).join(' ')).toLowerCase().includes(q)) res.push({ ic: 'lib', t: a.title, s: a.type + ' asset', go: '#library', ui: ['libOpen', a.id] }); });
  S.advocates.forEach(a => { if ((a.name + ' ' + a.unit).toLowerCase().includes(q)) res.push({ ic: 'user', t: a.name, s: a.circle + ' · ' + a.unit, go: '#network', ui: ['netQ', a.name] }); });
  S.inbox.forEach(m => { if (m.text.toLowerCase().includes(q)) res.push({ ic: 'care', t: m.text.slice(0, 70), s: 'Care desk · ' + m.ai.type, go: '#care', ui: ['careSel', m.id] }); });
  const p = document.createElement('div'); p.className = 'popover'; p.style.right = '420px';
  p.innerHTML = res.length ? res.slice(0, 14).map((r, i) => `<div class="it" data-act="search-go" data-i="${i}">${icon(r.ic, 16)}<div><div>${esc(r.t)}</div><div class="tiny muted">${esc(r.s)}</div></div></div>`).join('') : '<div class="empty">No matches</div>';
  p._res = res;
  $('#topbar').appendChild(p);
}

/* ---------- events ---------- */
function bindEvents() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!e.target.closest('.popover') && !e.target.closest('[data-act="notifs"]') && !e.target.closest('#gsearch')) closePops();
    if (!el) return;
    const a = el.getAttribute('data-act');
    if (ACT[a]) { e.preventDefault(); ACT[a](el, e); }
  });
  document.addEventListener('change', e => {
    if (e.target.id === 'rolesel') { S.role = e.target.value; toast(`Now working as ${ROLES[S.role].name} (${ROLES[S.role].user})`, 'user'); render(); return; }
    const k = e.target.getAttribute('data-change'); if (k && ONCHANGE[k]) ONCHANGE[k](e.target, e);
  });
  document.addEventListener('input', e => {
    if (e.target.id === 'gsearch') { doSearch(e.target.value); return; }
    const k = e.target.getAttribute('data-input'); if (k && ONINPUT[k]) ONINPUT[k](e.target, e);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeModal(); closePops(); }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); const s = $('#gsearch'); if (s) s.focus(); }
  });
  window.addEventListener('hashchange', () => { closeModal(); render(); });
}
ACT['close-modal'] = () => closeModal();
ACT.reset = () => openModal('Reset demo data?', '<p>This restores the original CIMB Niaga sample data: tasks, tickets, care queue, points and settings. Changes you made in this browser are cleared.</p>', '<button class="btn" data-act="close-modal">Cancel</button><button class="btn danger" data-act="reset-yes">Reset</button>');
ACT['reset-yes'] = () => { closeModal(); resetDemo(); };
ACT.notifs = () => { if ($('.popover')) { closePops(); return; } showNotifs(); };
ACT['read-all'] = () => { S.notifs.forEach(n => n.unread = false); closePops(); renderTop(); save(); };
ACT['open-notif'] = el => { const n = S.notifs.find(x => x.id === el.dataset.id); if (n) { n.unread = false; closePops(); if (n.go) go(n.go); else renderTop(); } };
ACT['search-go'] = el => { const p = el.closest('.popover'); const r = p._res[+el.dataset.i]; closePops(); $('#gsearch').value = ''; if (r.ui) S.ui[r.ui[0]] = r.ui[1]; go(r.go); };
ACT.drawer = () => { S.ui.drawer = !S.ui.drawer; document.body.classList.toggle('has-drawer', !!S.ui.drawer); render(); };
ACT.tab = el => { S.ui[el.dataset.k] = el.dataset.v; render(); };
ACT.go = el => go(el.dataset.href);
ACT.copy = el => copyText(el.dataset.text || ($(el.dataset.from) ? $(el.dataset.from).innerText || $(el.dataset.from).value : ''));

function lockMsg(what) { toast(`${ROLES[S.role].name} can’t ${what}. Each team publishes only to its own accounts.`, 'lock'); }

/* ---------- init ---------- */
function init() {
  S = load();
  if (!S) freshState();
  S.inbox.forEach(m => { if (!m.ai) prepInbox(m); });
  if (!S.phone) S.phone = phoneInit();
  document.body.classList.toggle('has-drawer', !!S.ui.drawer);
  initTip(); bindEvents(); render();
  setInterval(updateLive, 15000);
  AI.init();
}
document.addEventListener('DOMContentLoaded', init);

</script>
</body>
</html>
